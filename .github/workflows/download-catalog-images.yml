name: Download catalog product images

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/download_catalog_images.py'
      - '.github/workflows/download-catalog-images.yml'

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download product images from official product pages
        run: python3 scripts/download_catalog_images.py
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog-images
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Download catalog product images"
            git push
          fi
