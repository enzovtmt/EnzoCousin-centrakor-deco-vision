<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centrakor Déco Vision</title><style>
body{margin:0;font-family:Arial,sans-serif;color:#171717;background:#fff7f0}header{background:#f36f21;color:#fff;padding:22px 6vw;display:flex;justify-content:space-between;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:40px 22px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0001}h1{font-size:46px;margin:0 0 12px}label{font-weight:700;font-size:13px;display:block;margin:16px 0 6px}select,input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #ddd;font:inherit}button{margin-top:20px;background:#171717;color:#fff;font-weight:900;cursor:pointer}.preview img,.after img{width:100%;max-height:520px;object-fit:cover;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{background:#fff;border:1px solid #eaded5;border-radius:12px;padding:12px}.product img{width:100%;height:120px;object-fit:contain}.status{margin-top:15px;padding:12px;background:#fff;border-radius:10px}.error{color:#a00}@media(max-width:800px){.grid,.products{grid-template-columns:1fr}h1{font-size:36px}}</style></head><body><header><span>centrakor</span><span>Déco Vision · IA</span></header><main class="wrap"><div class="card"><h1>Visualisez votre future décoration.</h1><p>Importez une photo de votre pièce, choisissez votre style et laissez l’IA générer une nouvelle proposition avec des produits Centrakor.</p><label>Pièce</label><select id="room"><option>Salon</option><option>Chambre</option><option>Salle à manger</option><option>Entrée</option><option>Bureau</option></select><label>Style</label><select id="style"><option>Contemporain</option><option>Scandinave</option><option>Naturel</option><option>Industriel</option><option>Minimaliste</option></select><label>Budget</label><select id="budget"><option value="500">500 €</option><option value="1000" selected>1 000 €</option><option value="1500">1 500 €</option><option value="2000">2 000 €</option></select><label>Photo</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div id="preview" class="preview"></div><button id="go">Générer ma décoration avec l’IA</button><div id="status"></div></div><section id="result" style="display:none"><h2>Avant / Après</h2><div class="grid"><div><h3>Avant</h3><div class="preview"><img id="before"></div></div><div><h3>Après · IA</h3><div class="after"><img id="after"></div></div></div><h2>Produits proposés</h2><div id="products" class="products"></div></section></main><script>
const photo=document.getElementById('photo'),preview=document.getElementById('preview'),status=document.getElementById('status');photo.onchange=()=>{const f=photo.files[0];if(f)preview.innerHTML='<img src="'+URL.createObjectURL(f)+'">'};document.getElementById('go').onclick=async()=>{const f=photo.files[0];if(!f){status.className='status error';status.textContent='Ajoutez une photo.';return}const b=document.getElementById('go');b.disabled=true;status.className='status';status.textContent='Génération IA en cours…';const form=new FormData();form.append('roomImage',f);form.append('room',room.value);form.append('style',style.value);form.append('budget',budget.value);try{const r=await fetch('/api/generate',{method:'POST',body:form});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');before.src=URL.createObjectURL(f);after.src=d.image;products.innerHTML=d.products.map(p=>'<div class="product"><strong>'+p.name+'</strong><p>'+p.price.toFixed(2).replace('.',',')+' €</p></div>').join('');result.style.display='block';status.textContent='Image générée avec l’IA.';result.scrollIntoView({behavior:'smooth'})}catch(e){status.className='status error';status.textContent=e.message}finally{b.disabled=false}};</script></body></html>
